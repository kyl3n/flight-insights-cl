  at its top, then the knob turned to its bottom, and 6 roll doublets again, with
  RATE and the rate PIDs logged every loop during the doublets.'
parameters_set:
  LOG_DISARMED: 0
  SIM_ESC_TELEM: 0
  RC7_OPTION: 219
  TUNE: 49
  TUNE_MIN: 0.054
  TUNE_MAX: 0.135
  RC_OVERRIDE_TIME: -1
faults: []
expected:
- PTUN for function 49 throughout, the value 0.135 until the turn and 0.054 after
