[project]
name = "flight-insights-engine"
version = "0.1.0"
description = "Flight Insights analysis engine: decoding, analysis and recommendations for ArduPilot logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
]

[project.scripts]
fi-engine = "flight_insights.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_insights"]

[dependency-groups]
dev = [
    "pyarrow-stubs>=20.0.0.20260819",
    "pymavlink==2.4.50",
    "pyright",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
