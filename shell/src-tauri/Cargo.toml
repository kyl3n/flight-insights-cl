[package]
name = "flight-insights-shell"
version = "0.1.0"
description = "Flight Insights desktop shell"
edition = "2024"
publish = false

[lib]
name = "flight_insights_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = "1.9.0"
libsodium-sys-stable = "=1.24.0"
base64 = "=0.22.1"
getrandom = "0.4.3"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
keyring-core = "1.0.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
windows = { version = "0.62.2", features = ["Win32_System_Power"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
