[package]
name = "flight-insights-shell"
version = "0.1.0"
description = "Flight Insights desktop shell"
edition = "2024"
publish = false

[lib]
name = "flight_insights_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hex = "0.4.3"
zeroize = "1.9.0"
getrandom = "0.4.3"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
