name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks (flight data, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No flight data or keys outside tests/fixtures/
        run: python3 tools/check_repo_files.py
      - name: No flight data or keys in any commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_repo_files.py --commits "${BASE_SHA}..${HEAD_SHA}"
      - name: Repo check tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .

  fixtures:
    name: Fixtures (scrubber, labels, pymavlink reads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Lint tools
        run: |
          uvx ruff@0.17.1 check --config engine/pyproject.toml tools knowledge/tools knowledge/sim
          uvx ruff@0.17.1 format --check --config engine/pyproject.toml tools knowledge/tools knowledge/sim
      - run: >
          uv run --no-project --python 3.12 --with pytest --with "pymavlink==2.4.50"
          --with "pyyaml==6.0.2" --with "jsonschema==4.23.0" pytest tools/fixtures/tests

  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Procedure rehearsal tool (its safety checks and steps, without SITL)
        run: uv run pytest ../tools/procedures/tests
      - name: Phase 0 gate on the committed fixtures
        run: uv run fi-engine gate --corpus ../tests/fixtures --jobs 2

  scrubber:
    # The location scrubber's gate (spec: Testing, "Scrubber"): zero tolerance, so it
    # stands as its own check rather than one test among hundreds.
    name: Scrubber gate (no planted coordinate leaves)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Rules against every message, the packet corpus, and coordinates planted in every message type
        run: uv run pytest -q tests/test_scrubber_rules.py tests/test_scrubber.py tests/test_ai_packet.py tests/test_ai_exchange.py

  frozen-engine:
    name: Frozen engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Freeze with PyInstaller
        run: |
          uv run python packaging/freeze.py --dist build/dist | tee freeze.log
          echo "ENGINE_BINARY=$(tail -n 1 freeze.log)" >> "$GITHUB_ENV"
      - name: Smoke test (version, CLI analysis, JSON-RPC session)
        run: >
          uv run python packaging/smoke.py "$ENGINE_BINARY"
          ../tests/fixtures/sitl/4.7.0/heli-hover.bin ../knowledge
      - name: Size
        run: ls -l "$ENGINE_BINARY"

  benchmark:
    name: Decode benchmark (500 MB, spec target 60 s)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Build a 500 MB raw-IMU log from a fixture
        run: >
          uv run python bench/make_large_log.py
          ../tests/fixtures/sitl/4.7.0/copter-quad-rawimu.bin "$RUNNER_TEMP/large.bin" --megabytes 500
      - run: uv run python bench/bench_decode.py "$RUNNER_TEMP/large.bin" --max-seconds 60

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui check
      - run: pnpm --filter ui test
      - run: pnpm --filter ui build

  shell:
    name: Shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shell/src-tauri
    steps:
      - uses: actions/checkout@v4
      # The Ubuntu mirror has trickled packages at 20-40 KB/s for whole runs, and the
      # WebKitGTK headers pull in about 150 packages, so the downloaded .debs are kept
      # between runs and apt only fetches what changed.
      - name: Cache Linux build dependency packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-webkit2gtk-4.1-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-debs-${{ runner.os }}-webkit2gtk-4.1-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 40
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          apt_opts="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o DPkg::Lock::Timeout=300"
          packages="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev"
          # A failed attempt keeps what it downloaded, so a retry carries on from there.
          for attempt in 1 2 3; do
            if sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y $packages; then
              cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: shell/src-tauri
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Engine for the shell's integration test
        working-directory: engine
        run: uv sync --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (with the real engine)
        env:
          # Paths relative to shell/src-tauri, where cargo runs the tests.
          FI_ENGINE_CMD: '["uv", "run", "--project", "../../engine", "python", "-m", "flight_insights", "rpc"]'
          FI_KNOWLEDGE_DIR: ../../knowledge
        run: cargo test --locked
