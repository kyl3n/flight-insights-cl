# Installers (docs/SPEC.md, "System architecture" → Packaging): Windows NSIS and
# MSI, Linux RPM and AppImage built on the oldest Fedora release still supported.
# Every build gets its own version, 0.1.<run number>: an installer with an
# unchanged version does not upgrade the installed app (Tauri issue 15134).
# Each package is installed and its bundled engine run before it is uploaded.
# Code signing waits for certificates. CI never publishes a release.

name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/package.yml
      - shell/src-tauri/tauri.conf.json
      - shell/src-tauri/tauri.bundle.conf.json
      # a new native dependency (libsodium) must build into every installer
      - shell/src-tauri/Cargo.toml
      - shell/src-tauri/Cargo.lock
      - engine/packaging/**

permissions:
  contents: read

env:
  VERSION: 0.1.${{ github.run_number }}
  SMOKE_LOG: tests/fixtures/sitl/4.7.0/heli-hover.bin

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: shell/src-tauri
      - name: Freeze the engine as the app's sidecar
        working-directory: engine
        run: |
          uv sync --locked
          uv run python packaging/freeze.py
      - run: pnpm install --frozen-lockfile
      - name: Build the NSIS and MSI installers
        working-directory: shell
        run: >
          pnpm tauri build --bundles nsis,msi
          --config src-tauri/tauri.bundle.conf.json
          --config "{\"version\": \"$VERSION\"}"
      - name: Install, run the installed engine, uninstall
        run: |
          installer=$(ls shell/src-tauri/target/release/bundle/nsis/*.exe)
          "$installer" //S
          dir="$LOCALAPPDATA/Flight Insights"
          ls "$dir"
          test -f "$dir/knowledge/manifest.json"
          python engine/packaging/smoke.py "$dir/fi-engine.exe" "$SMOKE_LOG" "$dir/knowledge"
          "$dir/uninstall.exe" //S
      - name: Sizes
        run: ls -l shell/src-tauri/target/release/bundle/nsis shell/src-tauri/target/release/bundle/msi
      - uses: actions/upload-artifact@v4
        with:
          name: flight-insights-${{ env.VERSION }}-windows
          path: |
            shell/src-tauri/target/release/bundle/nsis/*.exe
            shell/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  fedora:
    name: Fedora RPM and AppImage
    runs-on: ubuntu-latest
    # The oldest Fedora release still supported. Fedora 43 reaches end of life on
    # 2026-12-09: move this job and rpm-install to 44 then.
    container: fedora:43
    steps:
      - name: Build tools
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc gcc-c++ make file which curl wget xz
          webkit2gtk4.1-devel openssl-devel librsvg2-devel libappindicator-gtk3-devel
          python3 nodejs npm
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: shell/src-tauri
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; the version in package.json's packageManager
      - name: Freeze the engine as the app's sidecar
        working-directory: engine
        run: |
          uv sync --locked
          uv run python packaging/freeze.py
      - run: pnpm install --frozen-lockfile
      - name: Build the RPM and AppImage
        working-directory: shell
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # linuxdeploy without FUSE, as in a container
          NO_STRIP: "1" # the frozen engine carries its own archive; stripping it breaks it
        run: >
          pnpm tauri build --bundles rpm,appimage
          --config src-tauri/tauri.bundle.conf.json
          --config "{\"version\": \"$VERSION\"}"
      - name: The AppImage holds the engine and the knowledge pack
        run: |
          cd "$RUNNER_TEMP"
          image=$(ls "$GITHUB_WORKSPACE"/shell/src-tauri/target/release/bundle/appimage/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --appimage-extract > /dev/null
          engine=$(find squashfs-root -name fi-engine -type f | head -n 1)
          pack=$(dirname "$(find squashfs-root -path '*knowledge/manifest.json' | head -n 1)")
          test -n "$engine" && test -d "$pack"
          python3 "$GITHUB_WORKSPACE/engine/packaging/smoke.py" "$engine" "$GITHUB_WORKSPACE/$SMOKE_LOG" "$pack"
      - name: Sizes
        run: ls -l shell/src-tauri/target/release/bundle/rpm shell/src-tauri/target/release/bundle/appimage
      - uses: actions/upload-artifact@v4
        with:
          name: flight-insights-${{ env.VERSION }}-fedora
          path: |
            shell/src-tauri/target/release/bundle/rpm/*.rpm
            shell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  rpm-install:
    name: RPM installs on a clean Fedora
    needs: fedora
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git python3
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine/packaging
            tests/fixtures/sitl/4.7.0
      - uses: actions/download-artifact@v4
        with:
          name: flight-insights-${{ env.VERSION }}-fedora
          path: dist
      - name: Install the RPM with its dependencies
        run: dnf install -y ./dist/rpm/*.rpm
      - name: Run the installed engine on the installed knowledge pack
        run: |
          name=$(rpm -qp --queryformat '%{NAME}' dist/rpm/*.rpm)
          engine=$(rpm -ql "$name" | grep '/fi-engine$')
          pack=$(dirname "$(rpm -ql "$name" | grep 'knowledge/manifest.json$')")
          echo "engine: $engine  pack: $pack"
          python3 engine/packaging/smoke.py "$engine" "$SMOKE_LOG" "$pack"
